# Verifies every push and pull request. On main it also deploys the exact dist/ that passed,
# then waits for the live site to serve this commit. Adapted from Engine-Builder's ci.yml.
#
# One-time setup, by hand, in the repo's Settings (until then the deploy job fails):
#   Pages -> Build and deployment -> Source: "GitHub Actions".
#   Pages -> Custom domain: life.rcjlabs.com, with Enforce HTTPS (D53). The DNS record is
#   `life` CNAME `rcjlabs.github.io.`. The deploy's page_url then names the domain.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main finish so a deployment is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    # The unit tests' sweeps, the seasons' 500 weeks among them (M2.10), and the browser specs
    # took about 20 minutes on 2026-10-26; the limit leaves room without letting a hang run on.
    timeout-minutes: 35
    # The site is served from the root of life.rcjlabs.com (decisions.md, D53), so the build's
    # base path is vite.config.ts's default, "/". LYL_BASE still sets another for a local check.
    steps:
      # The engine is a submodule pinned to a commit (decisions.md, D13); it is public.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # Installs the Chromium that matches the pinned @playwright/test (Engine-Builder's ci.yml).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      # The dist/ that passed every check above is the one that gets deployed. An artifact
      # deploy is served as-is (no Jekyll), so no .nojekyll is needed.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/game/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  confirm:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A green deploy job only says the upload worked. This waits until the live
      # version.json names this commit, so "deployed" means people are getting it.
      - name: Live site serves this commit
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in $(seq 1 30); do
            live=$(curl -fsS "${SITE}version.json?attempt=${attempt}" | jq -r .sha || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "live site serves $live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${SITE}version.json never showed $GITHUB_SHA (last seen: ${live:-nothing})"
          exit 1

      # version.json can be right while the page can't start: a build for the wrong base path
      # uploads fine. The engine's site-check loads what the live page loads, the service worker
      # included, and fails on anything missing, mistyped or from another site.
      - name: Live page loads its files
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: node engine/tools/site-check/src/cli.ts "$SITE"
