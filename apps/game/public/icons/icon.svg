    <polygon points="136,330 256,390 256,250 136,190" fill="#7f3226"/>
    <polygon points="256,390 376,330 376,190 256,250" fill="#b04a35"/>
    <polygon points="136,190 256,250 376,190 256,130" fill="#4a505e"/>
