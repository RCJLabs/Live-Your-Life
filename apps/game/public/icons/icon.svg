    <polygon points="160,265 190,280 190,245 160,230" fill="#263041"/>
    <polygon points="208,289 238,304 238,269 208,254" fill="#f2c66d"/>
    <polygon points="184,354 208,366 208,313 184,301" fill="#3b2a22"/>
    <polygon points="280,301 310,286 310,251 280,266" fill="#263041"/>
