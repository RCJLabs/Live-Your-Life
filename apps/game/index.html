<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2433" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A life sim in a fictional Rust Belt city. Design phase: an art test of one city block." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Live Your Life</title>
  </head>
  <body>
    <main class="spike">
      <h1 class="visually-hidden">Live Your Life: an art test</h1>
      <canvas
        id="city"
        class="city"
        role="img"
        aria-label="A city block seen from above: a diner, an apartment house and an empty shop on one street, with six people."
      ></canvas>
      <header class="top" id="top">
        <div class="clock">
          <p class="when" id="when">&nbsp;</p>
          <p class="build" id="build"></p>
        </div>
        <p class="fps" id="fps" aria-live="off"></p>
      </header>
      <nav class="controls" id="controls" aria-label="Controls">
        <button class="button" id="play" type="button">Pause</button>
        <button class="button" id="speed" type="button">Speed 1</button>
        <button class="button" id="walls" type="button" aria-pressed="true">Inside</button>
        <button class="button" id="bubbles" type="button" aria-pressed="true">Bubbles</button>
        <button class="button" id="day" type="button">Day</button>
        <button class="button" id="night" type="button">Night</button>
        <button class="button" id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button class="button" id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button class="button" id="measure" type="button">Measure</button>
        <button class="button" id="hide" type="button">Hide</button>
      </nav>
      <section class="measured" id="measured" aria-label="Frame rate" hidden>
        <p id="measured-text"></p>
        <div class="row">
          <button class="button" id="copy" type="button">Copy</button>
          <button class="button" id="close-measure" type="button">Close</button>
        </div>
      </section>
    </main>
    <div class="update" id="update" hidden>
      <span>A new version is ready.</span>
      <button class="button" id="update-now" type="button">Update</button>
    </div>
    <noscript>Live Your Life needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
